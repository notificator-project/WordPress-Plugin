name: Build and Release Plugin Zip

on:
  push:
    tags:
      - 'v*.*.*'
    tags-ignore:
      - 'v*.*.*-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate tag against plugin/readme versions
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION="$(grep -m1 -E '^\s*\*\s*Version:\s*' notificator-companion.php | sed -E 's/.*Version:\s*([^[:space:]]+).*/\1/')"
          STABLE_TAG="$(grep -m1 -E '^Stable tag:\s*' readme.txt | sed -E 's/^Stable tag:\s*([^[:space:]]+).*/\1/')"

          echo "Tag version: ${TAG_VERSION}"
          echo "Plugin version: ${PLUGIN_VERSION}"
          echo "Readme stable tag: ${STABLE_TAG}"

          if [[ "${PLUGIN_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "ERROR: notificator-companion.php Version (${PLUGIN_VERSION}) does not match tag (${TAG_VERSION})."
            exit 1
          fi

          if [[ "${STABLE_TAG}" != "${TAG_VERSION}" ]]; then
            echo "ERROR: readme.txt Stable tag (${STABLE_TAG}) does not match tag (${TAG_VERSION})."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build release package
        run: npm run build:release

      - name: Prepare versioned zip name
        id: package
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_ZIP="dist/notificator-companion.zip"
          TARGET_ZIP="dist/notificator-companion-${TAG_VERSION}.zip"

          if [[ ! -f "${SOURCE_ZIP}" ]]; then
            echo "ERROR: Expected package not found at ${SOURCE_ZIP}"
            exit 1
          fi

          mv "${SOURCE_ZIP}" "${TARGET_ZIP}"

          echo "zip_path=${TARGET_ZIP}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and upload zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Notificator Companion v${{ steps.package.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip_path }}
